services:
  web:
    build: .
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
      - /config/caddy
      - /data/caddy
    environment:
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /data
    # Sin "ports": solo es accesible desde cloudflared por la red interna.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?define TUNNEL_TOKEN en .env}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    depends_on:
      web:
        condition: service_healthy
